name: Deploy Frontend to Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Ansible Frontend Deployment on Master
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MASTER_HOST }}
          username: ubuntu
          key: ${{ secrets.MASTER_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "Starting targeted Frontend deployment..."
            export GH_PAT="${{ secrets.GH_PAT }}"
            cd /home/ubuntu
            ansible-playbook -i inventory.ini deploy.yml --tags frontend -v
            echo "Frontend deployment complete!"
